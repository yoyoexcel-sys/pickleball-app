<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1117">
<title>匹克球新手修炼手册 · PickleBoard</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-mobile-web-app-capable" content="yes">
<link rel="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-mobile-web-app-title" content="PickleBoard">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230f1117'/><text x='50' y='72' text-anchor='middle' font-size='55'>🎾</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230f1117'/><text x='50' y='72' text-anchor='middle' font-size='55'>🎾</text></svg>">
<meta name="description" content="匹克球12周训练看板 - 进度追踪、防放弃预警、卡路里记录、成就系统">
<meta property="og:title" content="PickleBoard · 匹克球训练看板">
<meta property="og:description" content="12周训练计划、防放弃预警、卡路里追踪、成就徽章，你的匹克球成长伙伴">
<meta property="og:type" content="website">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--bg2:#1a1d27;--bg3:#252836;--bg4:#2e3142;
  --green:#2ecc71;--green-d:#27ae60;--green-l:#81c784;--green-bg:rgba(46,204,113,.12);
  --accent:#f39c12;--accent-d:#e67e22;--accent-bg:rgba(243,156,18,.12);
  --red:#e74c3c;--red-bg:rgba(231,76,60,.12);
  --blue:#3498db;--blue-bg:rgba(52,152,219,.12);
  --purple:#9b59b6;--purple-bg:rgba(155,89,182,.12);
  --orange:#e67e22;--orange-bg:rgba(230,126,34,.12);
  --text:#e8e8e8;--text2:#9a9aaa;--text3:#666;
  --border:#2e3142;--radius:12px;--radius-s:8px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
html{font-size:16px;scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;min-height:100dvh;overflow-x:hidden}
a{color:var(--green);text-decoration:none}
button{cursor:pointer;font-family:inherit;border:none;outline:none;-webkit-appearance:none}
input,textarea,select{font-family:inherit;outline:none;-webkit-appearance:none}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:2px}

.app{display:flex;flex-direction:column;height:100vh;height:100dvh}

.sidebar{display:none;position:fixed;left:0;top:0;bottom:0;width:220px;background:var(--bg2);border-right:1px solid var(--border);padding:16px 0;z-index:100;flex-direction:column;overflow-y:auto}
.sidebar .logo{padding:0 16px 14px;border-bottom:1px solid var(--border);margin-bottom:12px}
.sidebar .logo h2{font-size:14px;color:var(--green);font-weight:700;display:flex;align-items:center;gap:6px}
.sidebar .logo h2 span{font-size:20px}
.sidebar .logo p{font-size:10px;color:var(--text3);margin-top:3px}
.nav-section{padding:12px 16px 4px;font-size:9px;text-transform:uppercase;color:var(--text3);letter-spacing:1px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 16px;font-size:13px;color:var(--text2);cursor:pointer;transition:all .15s;border-left:3px solid transparent;white-space:nowrap}
.nav-item:active{background:var(--bg3)}
.nav-item.active{background:var(--green-bg);color:var(--green);border-left-color:var(--green);font-weight:600}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--border);font-size:10px;color:var(--text3);margin-top:auto}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden}

.topbar{display:none;position:sticky;top:0;z-index:50;background:rgba(15,17,23,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:10px 24px;align-items:center;justify-content:space-between;gap:12px}
.topbar h1{font-size:16px;font-weight:700}
.topbar .streak-badge{display:flex;align-items:center;gap:5px;background:var(--accent-bg);color:var(--accent);padding:5px 12px;border-radius:16px;font-size:12px;font-weight:600}

.page-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;padding-top:calc(12px + var(--safe-t));flex-shrink:0}
.page-header h1{font-size:17px;font-weight:700}
.page-header .streak{display:flex;align-items:center;gap:4px;background:var(--accent-bg);color:var(--accent);padding:4px 10px;border-radius:14px;font-size:12px;font-weight:600}

.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 16px;padding-bottom:calc(16px + var(--safe-b))}
.page{display:none}
.page.active{display:block;animation:fadeIn .2s ease}

.tabbar{display:flex;background:var(--bg2);border-top:1px solid var(--border);padding:6px 4px;padding-bottom:calc(6px + var(--safe-b));flex-shrink:0;z-index:80}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--text3);font-size:10px;transition:color .15s;position:relative;min-width:0}
.tab-item.active{color:var(--green)}
.tab-item.active::before{content:'';position:absolute;top:-7px;left:50%;transform:translateX(-50%);width:20px;height:3px;background:var(--green);border-radius:2px}
.tab-item:active{opacity:.7}
.tab-icon{font-size:20px;line-height:1}
.tab-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

@media(min-width:769px){
  .sidebar{display:flex}
  .main{margin-left:220px}
  .topbar{display:flex}
  .tabbar{display:none}
  .page-header{display:none}
  .content{padding:20px 28px;max-width:1400px}
}

/* Components */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.card-title{font-size:14px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:400px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(2,1fr)}}

.stat{text-align:center;padding:14px 8px}
.stat .val{font-size:28px;font-weight:800;line-height:1.2}
.stat .val.green{color:var(--green)}
.stat .val.accent{color:var(--accent)}
.stat .val.blue{color:var(--blue)}
.stat .val.purple{color:var(--purple)}
.stat .val.orange{color:var(--orange)}
.stat .val.red{color:var(--red)}
.stat .lbl{font-size:11px;color:var(--text3);margin-top:4px}
.stat .sub{font-size:10px;color:var(--text3);margin-top:2px}

.pring{display:inline-flex;align-items:center;justify-content:center;position:relative}
.pring svg{transform:rotate(-90deg)}
.pring .pv{position:absolute;font-size:14px;font-weight:800;color:var(--green)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:9px 16px;border-radius:var(--radius-s);font-size:13px;font-weight:600;transition:all .15s;min-height:40px}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:active{background:var(--green-d);transform:scale(.97)}
.btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
.btn-secondary:active{background:var(--bg4)}
.btn-danger{background:var(--red-bg);color:var(--red)}
.btn-sm{padding:6px 12px;font-size:12px;min-height:32px}
.btn-full{width:100%}

.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:12px;font-size:10px;font-weight:600}
.badge-green{background:var(--green-bg);color:var(--green)}
.badge-accent{background:var(--accent-bg);color:var(--accent)}
.badge-red{background:var(--red-bg);color:var(--red)}
.badge-blue{background:var(--blue-bg);color:var(--blue)}
.badge-purple{background:var(--purple-bg);color:var(--purple)}
.badge-orange{background:var(--orange-bg);color:var(--orange)}

.wk{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-s);padding:12px;margin-bottom:8px;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;text-align:left;font-family:inherit;color:var(--text);-webkit-appearance:none;appearance:none;width:100%}
.wk:active{transform:scale(.98);border-color:var(--green)}
.wk.done{opacity:.6;border-left:3px solid var(--green)}
.wk.now{border-left:3px solid var(--accent)}
.wk .wh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.wk .wn{font-size:13px;font-weight:700}
.wk .wt{font-size:12px;color:var(--text2);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wk .wp{display:flex;align-items:center;gap:6px;margin-top:8px}
.wk .wp .bar{flex:1;height:3px;background:var(--bg);border-radius:2px;overflow:hidden}
.wk .wp .bf{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.wk .wp .pc{font-size:10px;color:var(--text3);min-width:28px;text-align:right}

.kboard{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory}
.kcol{min-width:260px;flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;scroll-snap-align:start}
.kcol-h{padding:10px 12px;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.kcol-h .ct{background:var(--bg4);padding:2px 7px;border-radius:8px;font-size:10px;color:var(--text2)}
.kcol.p1 .kcol-h{background:var(--green-bg);color:var(--green)}
.kcol.p2 .kcol-h{background:var(--accent-bg);color:var(--accent)}
.kcol.p3 .kcol-h{background:var(--purple-bg);color:var(--purple)}
.kcol.p4 .kcol-h{background:var(--blue-bg);color:var(--blue)}
.kcol-b{padding:10px}
@media(max-width:768px){.kboard{flex-direction:column}.kcol{min-width:auto}}

.sop{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-s);padding:14px;margin-bottom:10px}
.sop .sl{font-size:10px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.sop .st{color:var(--accent);font-weight:600;font-size:11px;text-transform:none;letter-spacing:0}
.sop ul{padding-left:16px;font-size:13px;color:var(--text2);line-height:1.7}
.sop ul li{margin-bottom:1px}

.ck{list-style:none;padding:0}
.ck li{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.ck li:last-child{border-bottom:none}
.ck .cb{width:22px;height:22px;border-radius:6px;border:2px solid var(--bg4);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:all .15s;cursor:pointer;font-family:inherit;padding:0;background:none;-webkit-appearance:none;appearance:none}
.ck .cb.on{background:var(--green);border-color:var(--green)}
.ck .cb.on::after{content:'✓';color:#fff;font-size:12px;font-weight:700}
.ck .ct{color:var(--text)}
.ck .ct.on{text-decoration:line-through;color:var(--text3)}

.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:200;display:none;justify-content:center;align-items:flex-end;align-items:center}
.modal-bg.open{display:flex}
.modal{background:var(--bg2);border-radius:16px 16px 0 0;width:100%;max-width:720px;max-height:92vh;overflow-y:auto;position:relative;-webkit-overflow-scrolling:touch}
@media(min-width:769px){.modal{border-radius:16px;margin:20px auto;max-height:85vh}.modal-bg{align-items:center}}
.modal-h{padding:18px 18px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;position:sticky;top:0;background:var(--bg2);z-index:1}
.modal-h h2{font-size:17px;font-weight:700}
.modal-h .sub{font-size:12px;color:var(--text2);margin-top:3px}
.modal-x{width:30px;height:30px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:16px;flex-shrink:0}
.modal-b{padding:16px 18px}
.modal-f{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:end;gap:8px;position:sticky;bottom:0;background:var(--bg2)}

.alert{padding:14px 16px;border-radius:var(--radius-s);margin-bottom:10px;font-size:13px;line-height:1.6}
.alert.g{background:var(--green-bg);border-left:3px solid var(--green)}
.alert.y{background:var(--accent-bg);border-left:3px solid var(--accent)}
.alert.r{background:var(--red-bg);border-left:3px solid var(--red)}
.alert .at{font-weight:700;margin-bottom:3px}

.ach{display:flex;align-items:center;gap:12px;padding:12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-s);margin-bottom:8px}
.ach.lock{opacity:.35;filter:grayscale(.7)}
.ach.on{border-color:var(--accent)}
.ach .ai{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.ach .ai.gb{background:var(--green-bg)}.ach .ai.ab{background:var(--accent-bg)}.ach .ai.bb{background:var(--blue-bg)}.ach .ai.pb{background:var(--purple-bg)}.ach .ai.ob{background:var(--orange-bg)}
.ach h4{font-size:13px;font-weight:600}
.ach p{font-size:11px;color:var(--text3);margin-top:1px}

.log{padding:12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-s);margin-bottom:8px}
.log .lh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.log .ld{font-size:11px;color:var(--text3)}
.log .lc{font-size:12px;color:var(--text2)}

.ref{padding:14px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-s);margin-bottom:10px}
.ref .rq{font-size:13px;font-weight:600;margin-bottom:8px;color:var(--green)}
.ref textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-s);padding:10px;color:var(--text);font-size:14px;resize:vertical;min-height:56px;line-height:1.5}
.ref textarea:focus{border-color:var(--green)}

.qm{background:var(--bg3);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.qm .qb{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;margin:10px 0}
.qm .qf{height:100%;border-radius:3px;transition:width .4s}
.qm .ql{display:flex;justify-content:space-between;font-size:11px;color:var(--text2)}

.rs{counter-reset:step;padding-left:0;list-style:none}
.rs li{position:relative;padding-left:44px;margin-bottom:18px}
.rs li::before{counter-increment:step;content:counter(step);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--green-bg);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.rs li h4{font-size:13px;font-weight:600;margin-bottom:3px}
.rs li p{font-size:12px;color:var(--text2);line-height:1.5}

/* Heatmap */
.heatmap{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin:8px 0}
.hm-cell{aspect-ratio:1;border-radius:3px;position:relative;font-size:9px;display:flex;align-items:center;justify-content:center;color:var(--text3);transition:all .2s}
.hm-cell.hm-0{background:var(--bg)}
.hm-cell.hm-1{background:var(--green-bg)}
.hm-cell.hm-2{background:rgba(46,204,113,.25)}
.hm-cell.hm-3{background:rgba(46,204,113,.45)}
.hm-cell.hm-4{background:var(--green)}
.hm-day{font-size:10px;color:var(--text3);text-align:center;padding:4px 0;font-weight:600}
.hm-wk{font-size:10px;color:var(--text3);display:flex;align-items:center;justify-content:flex-end;padding-right:4px;min-width:20px}

/* Risk trend */
.risk-trend{display:flex;align-items:flex-end;gap:2px;height:60px;padding:4px 0}
.rt-bar{flex:1;min-width:6px;border-radius:2px 2px 0 0;transition:height .3s;position:relative}
.rt-bar:hover::after{content:attr(data-v);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:9px;color:var(--text2);background:var(--bg);padding:1px 3px;border-radius:2px;white-space:nowrap}

/* Restart button */
.restart-btn{display:flex;align-items:center;gap:12px;padding:16px;background:linear-gradient(135deg,var(--green-bg),rgba(46,204,113,.2));border:2px solid var(--green);border-radius:var(--radius);margin-top:10px;cursor:pointer;transition:all .2s;width:100%;text-align:left;font-family:inherit;color:var(--text)}
.restart-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(46,204,113,.2)}
.restart-btn:active{transform:scale(.98)}
.restart-btn .rb-icon{font-size:28px}
.restart-btn .rb-title{font-size:15px;font-weight:700;color:var(--green)}
.restart-btn .rb-desc{font-size:12px;color:var(--text2);margin-top:2px}

/* Week completion */
.wc-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)}
.wc-row:last-child{border-bottom:none}
.wc-label{font-size:12px;color:var(--text2);min-width:36px}
.wc-bar-bg{flex:1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.wc-bar-fill{height:100%;border-radius:4px;transition:width .4s}
.wc-val{font-size:11px;font-weight:700;min-width:40px;text-align:right}

/* Phase card */
.phase-card{padding:12px;border-radius:var(--radius-s);border:1px solid var(--border);margin-bottom:8px;display:flex;gap:12px;align-items:flex-start}
.phase-card .pc-icon{font-size:24px;flex-shrink:0}
.phase-card .pc-title{font-size:13px;font-weight:700}
.phase-card .pc-desc{font-size:12px;color:var(--text2);line-height:1.5;margin-top:2px}

/* Personal motivation */
.motivation-box{background:linear-gradient(135deg,rgba(46,204,113,.08),rgba(52,211,153,.12));border:1px solid rgba(46,204,113,.2);border-radius:var(--radius);padding:16px;text-align:center;margin-bottom:12px}
.motivation-box .mq{font-size:15px;font-weight:600;color:var(--text);line-height:1.6}
.motivation-box .ma{font-size:12px;color:var(--green);margin-top:6px}

.quote{background:linear-gradient(135deg,rgba(46,204,113,.06),rgba(52,152,219,.06));border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center;margin:12px 0}
.quote .qt{font-size:14px;font-style:italic;line-height:1.6}
.quote .qa{font-size:11px;color:var(--text3);margin-top:6px}

.toast{position:fixed;bottom:calc(20px + var(--safe-b));left:50%;transform:translateX(-50%) translateY(60px);background:var(--bg3);border:1px solid var(--green);border-radius:var(--radius-s);padding:10px 18px;font-size:13px;z-index:999;opacity:0;transition:all .25s;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

.sync-box{padding:16px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px}
.sync-box h3{font-size:14px;font-weight:600;margin-bottom:8px}
.sync-box p{font-size:12px;color:var(--text2);margin-bottom:10px;line-height:1.5}
.sync-box textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-s);padding:10px;color:var(--text);font-size:11px;resize:vertical;min-height:60px;word-break:break-all;font-family:monospace}
.sync-box textarea:focus{border-color:var(--green)}
.sync-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}

.rtbl{width:100%;border-collapse:collapse;font-size:12px}
.rtbl th{text-align:left;padding:8px 6px;color:var(--text3);font-weight:600;border-bottom:1px solid var(--border)}
.rtbl td{padding:8px 6px;color:var(--text2);border-bottom:1px solid var(--border)}
.rtbl td:first-child{font-weight:600;color:var(--text)}

/* Calorie / Fitness chart */
.cal-bar{display:flex;align-items:flex-end;gap:4px;height:120px;padding:0 4px}
.cal-bar .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.cal-bar .bar-fill{width:100%;border-radius:4px 4px 0 0;transition:height .3s;min-height:2px;position:relative}
.cal-bar .bar-fill .bar-val{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--text2);white-space:nowrap}
.cal-bar .bar-label{font-size:9px;color:var(--text3);white-space:nowrap}
.cal-bar .bar-day.today .bar-fill{box-shadow:0 0 8px rgba(46,204,113,.3)}

.hr-zone{display:flex;height:24px;border-radius:12px;overflow:hidden;margin:8px 0}
.hr-zone>div{transition:width .3s;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff}
.hz1{background:#60a5fa}.hz2{background:#34d399}.hz3{background:#fbbf24}.hz4{background:#f97316}.hz5{background:#ef4444}

.intensity-row{display:flex;gap:6px}
.intensity-btn{flex:1;padding:10px 6px;border-radius:var(--radius-s);background:var(--bg3);border:2px solid var(--border);text-align:center;cursor:pointer;transition:all .15s;font-family:inherit;color:var(--text);-webkit-appearance:none;appearance:none}
.intensity-btn.sel{border-color:var(--green);background:var(--green-bg)}
.intensity-btn .int-icon{font-size:18px}
.intensity-btn .int-label{font-size:11px;font-weight:600;margin-top:2px}
.intensity-btn .int-desc{font-size:9px;color:var(--text3)}

.cal-est{background:var(--green-bg);border:1px solid var(--border);border-radius:var(--radius-s);padding:10px 14px;text-align:center;margin-top:12px}
.cal-est .cal-num{font-size:28px;font-weight:800;color:var(--green)}
.cal-est .cal-unit{font-size:12px;color:var(--text3)}
.cal-src-label{transition:all .15s;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
.cal-src-active{background:var(--green-bg)!important;border-color:var(--green)!important;color:var(--green)!important;font-weight:600}

/* Weight tracker */
.wt-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.wt-row:last-child{border-bottom:none}
.wt-date{font-size:12px;color:var(--text3);min-width:80px}
.wt-val{font-size:15px;font-weight:700;flex:1}
.wt-diff{font-size:11px;font-weight:600}
.wt-diff.down{color:var(--green)}.wt-diff.up{color:var(--red)}.wt-diff.same{color:var(--text3)}

.wt-spark{display:flex;align-items:flex-end;gap:2px;height:50px}
.wt-spark .spark-bar{flex:1;background:var(--green);border-radius:2px 2px 0 0;min-width:3px;transition:height .3s;opacity:.6}
.wt-spark .spark-bar:last-child{opacity:1}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.streak-fire{animation:pulse 1.5s infinite}
.empty-state{text-align:center;padding:40px 20px;color:var(--text3)}
.empty-state .ei{font-size:40px;margin-bottom:10px}
</style>

  s1:{n:'自练#1',met:5.5},
  s2:{n:'自练#2',met:5.5},
  s3:{n:'自练#3',met:5.5}
};
// Intensity multiplier
const IM={light:0.75,moderate:1.0,vigorous:1.35};
const IL={light:{i:'🚶',l:'轻度',d:'微出汗'},moderate:{i:'🏃',l:'中度',d:'明显出汗'},vigorous:{i:'💨',l:'高强度',d:'大汗淋漓'}};
// HR zone colors & names
const HZ=[{n:'热身',c:'#60a5fa',min:50,max:60},{n:'燃脂',c:'#34d399',min:60,max:70},{n:'有氧',c:'#fbbf24',min:70,max:80},{n:'无氧',c:'#f97316',min:80,max:90},{n:'极限',c:'#ef4444',min:90,max:100}];

function calcCal(type,intensity,durMin,weightKg){
  const met=(TT[type]?.met||5)*((IM[intensity]||1));
  return Math.round(met*3.5*weightKg/200*durMin);
}
function estHR(intensity,age){
  const maxHR=220-age;
  const ranges={light:[.50,.60],moderate:[.60,.75],vigorous:[.75,.90]};
  const r=ranges[intensity]||ranges.moderate;
  return[Math.round(maxHR*r[0]),Math.round(maxHR*r[1])];
}

// ═══════════════ STATE ═══════════════
const SK='pickleboard_v3';
const DVER=3;
function ds(){return{sd:new Date().toISOString().slice(0,10),weight:60,age:35,wt:[],wp:{},logs:[],refs:{},achs:[],lt:null,cb:false,_v:DVER}}
let S;
function migrate(data){
  if(!data._v||data._v<DVER){
    const d=ds();
    for(const k in d){if(!(k in data))data[k]=d[k]}
    data._v=DVER;
  }
  return data;
}
function load(){try{const r=localStorage.getItem(SK);if(r){S=JSON.parse(r);S=migrate(S)}else S=ds()}catch(e){S=ds()}}
function save(){localStorage.setItem(SK,JSON.stringify(S))}
function wp(wi){if(!S.wp[wi])S.wp[wi]={c:0,s1:0,s2:0,s3:0,ms:[]};return S.wp[wi]}
function wc(wi){const p=wp(wi);return p.c&&p.s1&&p.s2&&p.s3?1:0}
function pc(pi){return W.filter(w=>w.ph===pi).every(w=>wc(w.id))}
function cw(){if(!S.sd)return 1;const s=new Date(S.sd),n=new Date(),d=Math.floor((n-s)/(7*864e5));return Math.min(12,Math.max(1,d+1))}
function streak(){if(!S.lt)return 0;let c=0,d=new Date(S.lt);while(true){const ds=d.toISOString().slice(0,10);if(S.logs.some(l=>l.date===ds)){c++;d.setDate(d.getDate()-1)}else break}return c}
function dsl(){if(!S.lt)return -1;const today=new Date().toISOString().slice(0,10);const last=new Date(S.lt).toISOString().slice(0,10);if(today===last)return 0;return Math.floor((new Date(today)-new Date(last))/864e5)}
function opct(){let t=48,d=0;for(const w of W){const p=wp(w.id);d+=p.c+p.s1+p.s2+p.s3}return Math.round(d/t*100)}
function totalCal(){return S.logs.reduce((s,l)=>s+(l.cal||0),0)}
function weekCal(){
  const now=new Date(),dow=now.getDay(),mon=new Date(now);mon.setDate(now.getDate()-(dow===0?6:dow-1));mon.setHours(0,0,0,0);
  return S.logs.filter(l=>new Date(l.date)>=mon).reduce((s,l)=>s+(l.cal||0),0);
}
function monthCal(){
  const now=new Date(),y=now.getFullYear(),m=now.getMonth();
  return S.logs.filter(l=>{const d=new Date(l.date);return d.getFullYear()===y&&d.getMonth()===m}).reduce((s,l)=>s+(l.cal||0),0);
}
function avgHRByIntensity(){
  // Return distribution of intensity sessions
  const dist={light:0,moderate:0,vigorous:0};
  S.logs.forEach(l=>{if(l.intensity)dist[l.intensity]=(dist[l.intensity]||0)+1});
  return dist;
}

// ═══════════════ ACHIEVEMENTS ═══════════════
function chk(){
  const u=id=>{if(!S.achs.includes(id)){S.achs.push(id);toast(`🏅 ${AC.find(a=>a.id===id)?.n}`)}};
  if(S.logs.length>=1)u('fl');if(wc(1))u('w1');
  const sk=streak();if(sk>=3)u('s3');if(sk>=7)u('s7');if(sk>=14)u('s14');
  if(pc(1))u('p1');if(pc(2))u('p2');if(pc(3))u('p3');if(pc(4))u('p4');
  if(S.logs.length>=10)u('l10');if(S.logs.length>=30)u('l30');
  if(Object.keys(S.refs).length>=1)u('rf');
  const tc=totalCal();if(tc>=1000)u('cal1');if(tc>=5000)u('cal5');if(tc>=10000)u('cal10');
  if(S.wt.length>=5)u('wt5');if(S.wt.length>=10)u('wt10');
  save();
}

const PT={'dashboard':'总览仪表盘','kanban':'12周看板','training':'训练日志','fitness':'健身数据','anti-quit':'防放弃系统','achievements':'成就徽章','reflection':'周度复盘','rules':'规则速查','sync':'数据同步','settings':'数据管理'};
let curPage='dashboard';

function go(page){
  document.querySelectorAll('.nav-item').forEach(n=>{n.classList.toggle('active',n.dataset.page===page)});
  document.querySelectorAll('.tab-item').forEach(t=>{t.classList.toggle('active',t.dataset.page===page)});
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('pg-'+page).classList.add('active');
  document.getElementById('ptitle').textContent=PT[page]||'';
  document.getElementById('mtitle').textContent=PT[page]||'';
  curPage=page;
  render(page);
  us();
}
document.querySelectorAll('.nav-item,.tab-item').forEach(el=>el.addEventListener('click',()=>go(el.dataset.page)));
document.getElementById('mmenu').querySelectorAll('.nav-item').forEach(el=>el.addEventListener('click',()=>{document.getElementById('mmenu').classList.remove('open');go(el.dataset.page)}));

function us(){
  const s=streak(),tc=totalCal();
  document.getElementById('streak-c').textContent=s;document.getElementById('streak-m').textContent=s;
  document.getElementById('cal-c').textContent=Math.round(tc/1000);document.getElementById('cal-m').textContent=tc>=1000?(tc/1000).toFixed(1)+'k':tc;
}

function render(p){
  ({dashboard:rDash,kanban:rKanban,training:rLog,fitness:rFitness,'anti-quit':rQuit,achievements:rAch,reflection:rRef,rules:rRules,sync:rSync,settings:rSet})[p]?.();
}

function pring(pct,sz=68,sw=5){
  const r=(sz-sw)/2,c=2*Math.PI*r,o=c-pct/100*c;
  return `<div class="pring" style="width:${sz}px;height:${sz}px"><svg width="${sz}" height="${sz}"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="var(--bg)" stroke-width="${sw}"/><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="var(--green)" stroke-width="${sw}" stroke-dasharray="${c}" stroke-dashoffset="${o}" stroke-linecap="round" style="transition:stroke-dashoffset .5s"/></svg><span class="pv">${pct}%</span></div>`;
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}

      <div class="card stat"><div class="val orange">${tc>=1000?(tc/1000).toFixed(1)+'k':tc}</div><div class="lbl">总消耗千卡</div></div>

    </div>

      <div style="font-size:13px;color:var(--text2);margin-bottom:10px"><b style="color:var(--green)">教练课：</b>${w0.coach}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary btn-sm" onclick="owm(${cw_i})">查看SOP →</button><button class="btn btn-secondary btn-sm" onclick="olm(${cw_i},'self1')">📝 快速记录</button></div>
    </div>
    <div class="card"><div class="card-title">📊 12周进度</div><div class="grid-3">${wc_h}</div></div>

  const el=document.getElementById('pg-kanban'),cw_i=cw();

  document.getElementById('wmodal').classList.add('open');
}
function cwm(){document.getElementById('wmodal').classList.remove('open')}
function ts(wi,k){const p=wp(wi);p[k]=p[k]?0:1;if(p[k]){S.lt=new Date().toISOString().slice(0,10);const cal=calcCal(k,'moderate',k==='c'?60:67,S.weight||60);S.logs.push({id:Date.now(),date:S.lt,wi,t:k,dur:k==='c'?60:67,mood:'good',intensity:'moderate',cal,notes:'看板打卡'})}save();chk();owm(wi)}
function tm(wi,i){const p=wp(wi);if(!p.ms)p.ms=[];p.ms[i]=p.ms[i]?0:1;save();chk();owm(wi)}

function switchCalMode(mode){
  lmS.calMode=mode;
  document.querySelectorAll('.cal-src-label').forEach(el=>{el.classList.remove('cal-src-active')});
  document.querySelector(`.cal-src-label:nth-child(${mode==='auto'?1:2})`).classList.add('cal-src-active');
  document.getElementById('intensity-block').style.display=mode==='auto'?'':'none';
  document.getElementById('watch-cal-block').style.display=mode==='watch'?'':'none';
  document.getElementById('cal-est-label').textContent=mode==='auto'?'预计消耗':'手表记录';
  document.getElementById('cal-est-sub').textContent=mode==='auto'?`千卡 (基于 ${S.weight||60}kg)`:'千卡';
  if(mode==='watch'){document.getElementById('cal-est-val').textContent=document.getElementById('lwc').value||'0'}
  else{updateCalEst()}
}

    const maxH=100;const h=Math.min(maxH,Math.max(4,(cal/Math.max(500,wc*1.5))*maxH));

      <div class="card stat"><div class="val accent">${wc}</div><div class="lbl">本周消耗</div><div class="sub">月累计 ${mc}</div></div>
      <div class="card stat"><div class="val blue">${avgDur}</div><div class="lbl">平均时长(min)</div></div>
      <div class="card stat"><div class="val green">${equivSteps}</div><div class="lbl">等效步数</div></div>
    </div>

    <div class="card"><div class="card-title">📊 本周每日消耗</div><div class="cal-bar">${dailyBars}</div><div style="font-size:11px;color:var(--text3);margin-top:8px;text-align:center">本周目标：${Math.round((S.weight||60)*35*4/7)}千卡 (WHO建议周运动消耗)</div></div>

    <div class="card"><div class="card-title">📈 近8周趋势</div><div class="cal-bar">${weeklyBars}</div><div style="font-size:11px;color:var(--text3);margin-top:8px">单位：千卡/周</div></div>

    ${totalSessions?`<div class="card"><div class="card-title">❤️ 训练强度分布</div>

        <div class="stat"><div class="val" style="color:#60a5fa">${dist.light||0}</div><div class="lbl">🚶 轻度</div></div>
        <div class="stat"><div class="val" style="color:#34d399">${dist.moderate||0}</div><div class="lbl">🏃 中度</div></div>
        <div class="stat"><div class="val" style="color:#f97316">${dist.vigorous||0}</div><div class="lbl">💨 高强度</div></div>
      </div>
      <div style="font-size:11px;color:var(--text3);margin-top:8px;text-align:center">建议：匹克球以中高强度为主，搭配20%低强度恢复训练</div>

      ${S.weight?`<div style="font-size:12px;color:var(--text2);margin-bottom:8px">当前设置体重：<b style="color:var(--green)">${S.weight}kg</b> · 用于卡路里计算 · 在"数据管理"中修改</div>`:`<div style="font-size:12px;color:var(--text2);margin-bottom:8px">设置体重后才能精确计算卡路里消耗</div>`}
      ${wtsAll.length?`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><span style="font-size:12px;color:var(--text2)">${wtsAll.length}次记录</span><button class="btn btn-primary btn-sm" onclick="openWtModal()">+ 记录体重</button></div>
        ${wtsAll.length>1?wtSpark:''}

    </div>

    <div class="card"><div class="card-title">🎯 卡路里等价参考</div>
    <div style="font-size:12px;color:var(--text2);line-height:2">
      你累计消耗的 <b style="color:var(--orange)">${tc}千卡</b> 大约等于：<br>
      🏃 慢跑 <b>${(tc/60*1).toFixed(1)}公里</b>（60kg体重）<br>
      🚶 步行 <b>${Math.round(tc/4)}分钟</b>（中等配速）<br>

    <div class="ref"><div class="rq">1️⃣ 这周最有成就感的一刻？</div><textarea id="rq1" placeholder="某个动作突然对了、某次对打很流畅……">${rf.q1||''}</textarea></div>

// ═══════════════ SYNC ═══════════════
function rSync(){
  const el=document.getElementById('pg-sync');const code=genCode();
  const lastSave=S.lt?'上次训练: '+S.lt+' · 共'+S.logs.length+'条记录 · 总计'+totalCal()+'千卡':'暂无训练记录';
  el.innerHTML=`
    <div class="sync-box"><h3>📤 导出同步码</h3><p>将你的所有训练数据压缩成一个同步码。在另一台设备上"导入"即可打通数据。</p>
    <textarea id="sync-code" readonly>${code}</textarea>
    <div class="sync-actions"><button type="button" class="btn btn-primary btn-sm" onclick="navigator.clipboard?.writeText(document.getElementById('sync-code').value).then(()=>toast('✅ 已复制到剪贴板')).catch(()=>{document.getElementById('sync-code').select();document.execCommand('copy');toast('✅ 已复制')})">📋 复制同步码</button>
    <button type="button" class="btn btn-secondary btn-sm" onclick="shareSync()">📤 分享链接</button></div></div>
    <div class="sync-box"><h3>📥 导入同步码</h3><p>粘贴另一台设备导出的同步码，覆盖当前数据。<b style="color:var(--red)">会覆盖当前所有数据！</b></p>
    <textarea id="sync-import" placeholder="粘贴同步码到这里……"></textarea>
    <div class="sync-actions"><button type="button" class="btn btn-primary btn-sm" onclick="importCode()">📥 导入数据</button></div></div>
    <div class="sync-box"><h3>📁 文件导出/导入</h3><p>导出为JSON文件保存到本地，或从文件导入。适合大容量数据传输，不怕同步码被截断。</p>
    <div class="sync-actions"><button type="button" class="btn btn-primary btn-sm" onclick="exportFile()">💾 导出JSON文件</button>
    <button type="button" class="btn btn-secondary btn-sm" onclick="document.getElementById('file-import').click()">📂 从文件导入</button>
    <input type="file" id="file-import" accept=".json" style="display:none" onchange="importFile(this)"></div></div>
    <div class="card"><div class="card-title">💡 手机↔电脑同步指南</div><div style="font-size:13px;color:var(--text2);line-height:1.7">
    <div style="padding:10px;background:var(--bg3);border-radius:var(--radius-s);margin-bottom:10px;font-size:12px">${lastSave}</div>
    <b>方式一：同步码（小数据量）</b><br>1. 手机上点"复制同步码"<br>2. 电脑上粘贴到"导入同步码"并点击导入<br>3. 反过来也一样<br><br>
    <b>方式二：文件传输（推荐）</b><br>1. 手机上点"导出JSON文件"下载<br>2. 通过微信/飞书/AirDrop发到电脑<br>3. 电脑上点"从文件导入"选择文件<br><br>
    <b>方式三：分享链接</b><br>点击"分享链接"生成带数据的URL，对方打开即自动导入<br><br>
    <b style="color:var(--accent)">⚠️ 注意：</b>同步是覆盖式的，不是合并。后导入的数据会完全替换先前的数据。</div></div>`;
}
function genCode(){try{return btoa(unescape(encodeURIComponent(JSON.stringify(S))))}catch(e){return''}}
function importCode(){
  const raw=document.getElementById('sync-import').value.trim();
  if(!raw){toast('❌ 请先粘贴同步码');return}
  try{const data=JSON.parse(decodeURIComponent(escape(atob(raw))));if(!data.wp&&!data.logs){toast('❌ 同步码格式错误');return}
    S={...ds(),...data};S=migrate(S);save();toast('✅ 数据已同步，页面刷新中');setTimeout(()=>location.reload(),800)}catch(e){toast('❌ 同步码无效')}
}
function exportFile(){
  const json=JSON.stringify(S,null,2);
  const blob=new Blob([json],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='pickleboard-data-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  toast('✅ 数据文件已下载');
}
function importFile(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      if(!data.wp&&!data.logs){toast('❌ 文件格式错误');return}
      if(!confirm('导入将覆盖当前所有数据，确定吗？'))return;
      S={...ds(),...data};S=migrate(S);save();toast('✅ 数据已从文件导入，页面刷新中');setTimeout(()=>location.reload(),800);
    }catch(err){toast('❌ 文件解析失败')}
  };
  reader.readAsText(file);input.value='';
}
function shareSync(){const code=genCode();if(!code){toast('❌ 无数据可分享');return}
  const url=location.href.split('#')[0]+'#sync='+encodeURIComponent(code);
  if(navigator.share){navigator.share({title:'PickleBoard 数据同步',text:'匹克球训练数据同步码',url:url}).catch(()=>{})}else{navigator.clipboard?.writeText(url).then(()=>toast('✅ 同步链接已复制')).catch(()=>{const ta=document.createElement('textarea');ta.value=url;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);toast('✅ 同步链接已复制')})}}
function checkUrlSync(){const h=location.hash;if(h.startsWith('#sync=')){const code=decodeURIComponent(h.slice(6));if(code){try{const data=JSON.parse(decodeURIComponent(escape(atob(code))));if(data.wp||data.logs){S={...ds(),...data};S=migrate(S);save();location.hash='';toast('✅ 数据已从链接同步')}}catch(e){}}}}

    <button class="btn btn-primary btn-sm" onclick="S.weight=parseFloat(document.getElementById('s-weight').value)||60;S.age=parseInt(document.getElementById('s-age').value)||35;save();toast('✅ 身体数据已更新');render(curPage)">保存</button>
    <div style="font-size:11px;color:var(--text3);margin-top:8px">公式：千卡 = MET × 3.5 × 体重(kg) ÷ 200 × 时长(分钟) × 强度系数</div></div>
    <div class="card"><div class="card-title">📊 数据概览</div><div class="grid-2">
      <div class="stat"><div class="val green">${S.logs.length}</div><div class="lbl">训练记录</div></div>
      <div class="stat"><div class="val orange">${totalCal()}</div><div class="lbl">总消耗(千卡)</div></div>
      <div class="stat"><div class="val blue">${W.filter(w=>wc(w.id)).length}/12</div><div class="lbl">完成周数</div></div>
      <div class="stat"><div class="val purple">${S.achs.length}/${AC.length}</div><div class="lbl">解锁成就</div></div>
      <div class="stat"><div class="val accent">${S.wt.length}</div><div class="lbl">体重记录</div></div>
      <div class="stat"><div class="val green">${Math.round(S.logs.reduce((s,l)=>s+(l.dur||0),0)/60)}</div><div class="lbl">累计(时)</div></div></div></div>
    <div class="card"><div class="card-title" style="color:var(--red)">🗑 重置数据</div><p style="font-size:13px;color:var(--text2);margin-bottom:10px">清除所有数据，不可撤销。</p><button class="btn btn-danger btn-sm" onclick="if(confirm('确定重置所有数据？')){localStorage.removeItem(SK);location.reload()}">确认重置</button></div>`;
}

load();checkUrlSync();chk();rDash();us();
